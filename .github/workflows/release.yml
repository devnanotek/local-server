# Yeni sürüm yayınlama:
#   1) CHANGELOG.md'ye "## [1.3.0] - TARİH" bölümünü ekleyin
#   2) Etiketi gönderin:  git tag v1.3.0  &&  git push origin v1.3.0
#      (ya da GitHub → Actions → "Sürüm yayınla" → Run workflow → sürüm: 1.3.0)
# Program bu sürüm numarasıyla derlenir; DevNanotek.exe, devnanotek.sh, kılavuz ve SHA256 özetleri
# GitHub Releases'a yüklenir. Kurulu programlar yeni sürümü kendiliğinden görür.
name: Sürüm yayınla

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Sürüm numarası (ör. 1.3.0)'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'

      - name: Sürüm numarası
        id: ver
        shell: pwsh
        run: |
          $v = if ('${{ github.event_name }}' -eq 'workflow_dispatch') { '${{ inputs.version }}' } else { '${{ github.ref_name }}' }
          $v = $v.Trim().TrimStart('v')
          if ($v -notmatch '^\d+\.\d+\.\d+$') { throw "Geçersiz sürüm: '$v' (beklenen biçim: 1.3.0)" }
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: Linux betiğine sürüm numarasını yaz
        shell: pwsh
        run: |
          $f = 'linux/devnanotek.sh'
          $t = [IO.File]::ReadAllText($f) -replace 'DN_VERSION="[^"]*"', 'DN_VERSION="${{ steps.ver.outputs.version }}"'
          [IO.File]::WriteAllText($f, $t.Replace("`r`n", "`n"), (New-Object System.Text.UTF8Encoding($false)))

      - name: Derle
        run: dotnet build src/DevNanotek/DevNanotek.csproj -c Release -o build/release --nologo -p:Version=${{ steps.ver.outputs.version }} -p:FileVersion=${{ steps.ver.outputs.version }}.0

      - name: Paketle ve sürüm notlarını hazırla
        shell: pwsh
        run: |
          $v = '${{ steps.ver.outputs.version }}'
          New-Item -ItemType Directory -Force out | Out-Null
          Copy-Item build/release/DevNanotek.exe out/
          Copy-Item linux/devnanotek.sh, linux/KURULUM.md out/
          Copy-Item src/DevNanotek/Resources/Kilavuz.html out/
          $files = 'DevNanotek.exe', 'devnanotek.sh', 'KURULUM.md', 'Kilavuz.html'
          $sums = $files | ForEach-Object { '{0}  {1}' -f (Get-FileHash "out/$_" -Algorithm SHA256).Hash.ToLower(), $_ }
          [IO.File]::WriteAllText('out/SHA256SUMS.txt', ($sums -join "`n") + "`n")

          $cl = Get-Content CHANGELOG.md -Raw
          $m = [regex]::Match($cl, "(?ms)^## \[$([regex]::Escape($v))\][^\n]*\n(.*?)(?=^## \[|\z)")
          $notes = if ($m.Success) { $m.Groups[1].Value.Trim() } else { "DEVNANOTEK Local Server $v" }
          $notes += "`n`n---`n"
          $notes += "**Windows:** ``DevNanotek.exe`` dosyasını indirip çalıştırın (Windows 10/11 · 64 bit, 32 bit, ARM64).`n`n"
          $notes += "**Linux:** ``curl -fsSLO https://github.com/${{ github.repository }}/releases/latest/download/devnanotek.sh && sudo bash devnanotek.sh install```n`n"
          $notes += "Dosyaların SHA256 özetleri: ``SHA256SUMS.txt``"
          [IO.File]::WriteAllText('out/notes.md', $notes)

      - name: GitHub sürümünü oluştur
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: DEVNANOTEK ${{ steps.ver.outputs.version }}
          body_path: out/notes.md
          make_latest: true
          files: |
            out/DevNanotek.exe
            out/devnanotek.sh
            out/KURULUM.md
            out/Kilavuz.html
            out/SHA256SUMS.txt
